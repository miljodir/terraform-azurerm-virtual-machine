name: Terraform tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: miljodir/workflow-templates/.github/workflows/terraform-test.yaml@30a395d5fc04a6f381458d8f6de02a823fe73d19
    with:
      engine: terraform
      terraform-version: "1.x"
      test-override-directory: tests/overrides
